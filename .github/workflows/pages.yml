name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, claude/epic-cori-c2voki]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only what the site needs; the original photos in assets/Cityprint stay out.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml CNAME _site/
          mkdir -p _site/assets && cp -r assets/img assets/fonts _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
